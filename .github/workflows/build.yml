name: Build Zhouzimo Kernel

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch to build"
        required: true
        default: "zhouzimo"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Kernel Source
        run: |
          git clone \
            --recursive \
            --depth=1 \
            -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/${{ github.repository }}.git kernel

      - name: Debug
        run: |
          cd kernel

          echo "Current branch:"
          git rev-parse --abbrev-ref HEAD

          echo
          echo "Defconfig list:"
          ls arch/arm64/configs/vendor | grep munch || true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            dwarves \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            zstd \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Download Neutron Clang
        run: |
          wget -O clang.tar.zst \
            https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst

          mkdir -p clang
          tar --zstd -xf clang.tar.zst -C clang

          echo "=== TOOLCHAIN STRUCTURE ==="
          find clang | head -50

      - name: Setup Toolchain
        run: |
          CLANG_DIR=$(find $GITHUB_WORKSPACE/clang -type d -name bin | head -1)

          echo "CLANG_DIR=$CLANG_DIR"

          export PATH=$CLANG_DIR:$PATH

          which clang
          clang --version

          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Setup KernelSU
        working-directory: kernel
        run: |
          set -euo pipefail
          echo "=== Setup KernelSU ==="

          curl -LSs https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh | bash -

          echo "=== Patch Extra Manager Support (noroisu) ==="
          python3 - <<'PY'
          from pathlib import Path

          tracker = Path("KernelSU/kernel/manager/throne_tracker.c")
          t_src = tracker.read_text()
          t_old = (
              '#define is_midorisu_apk(tgt) extra_manager_apk(tgt, "com.midori.supermanager")\n'
              '#define test_extra_pkgs(tgt) (is_kowsu_apk(tgt) || is_midorisu_apk(tgt))'
          )
          t_new = (
              '#define is_midorisu_apk(tgt) extra_manager_apk(tgt, "com.midori.supermanager")\n'
              '#define is_noroisu_apk(tgt) extra_manager_apk(tgt, "com.noroi.supermanager")\n'
              '#define test_extra_pkgs(tgt) (is_kowsu_apk(tgt) || is_midorisu_apk(tgt) || is_noroisu_apk(tgt))'
          )
          assert t_src.count(t_old) == 1, "throne_tracker.c anchor changed"
          tracker.write_text(t_src.replace(t_old, t_new, 1))

          apk_sign = Path("KernelSU/kernel/manager/apk_sign.c")
          a_src = apk_sign.read_text()
          a_old = (
              '\t// midori01/KernelSU\n'
              '\tif (check_v2_signature(path, 0x0368, "b9ee6759de4794f954883458b722b97ae6527cb7709a051db9a2348c0eea1e42"))\n'
              '\t\treturn true;\n\n'
              '\treturn false;'
          )
          a_new = (
              '\t// midori01/KernelSU\n'
              '\tif (check_v2_signature(path, 0x0368, "b9ee6759de4794f954883458b722b97ae6527cb7709a051db9a2348c0eea1e42"))\n'
              '\t\treturn true;\n\n'
              '\t// re-noroi/KernelSU\n'
              '\tif (check_v2_signature(path, 0x037c, "cb4c3be2293943b82bd85c77a93c2317d34b99b8dc1b323b75ff8cebb4b2c2ba"))\n'
              '\t\treturn true;\n\n'
              '\treturn false;'
          )
          assert a_src.count(a_old) == 1, "apk_sign.c anchor changed"
          apk_sign.write_text(a_src.replace(a_old, a_new, 1))
          PY

          echo "=== Verify KernelSU ==="
          grep -R "KernelSU" -n drivers 2>/dev/null | head || true

      - name: Build Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=zhouzimo
          export KBUILD_BUILD_HOST=munch

          make O=out vendor/munch_defconfig
          grep -q '^CONFIG_KSU=y$' out/.config

          make -j$(nproc) \
            O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          echo "KERNEL_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "KERNEL_SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "KERNEL_RELEASE=$(cat out/include/config/kernel.release)" >> $GITHUB_ENV

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/kvsnr113/AnyKernel3.git AnyKernel3

      - name: Package Kernel
        run: |
          TARGET=MUNCH

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/${TARGET}-Image
          cp kernel/out/arch/arm64/boot/dtb AnyKernel3/${TARGET}-dtb
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/${TARGET}-dtbo.img

          sed -i "s/devicename=.*/devicename=munch/" AnyKernel3/anykernel.sh
          sed -i 's|^kernel.string=.*|kernel.string=\\\\ Zhouzimo Kernel (E404R Base) \\\\|' AnyKernel3/anykernel.sh
          sed -i 's| E404R Kernel @ Project113 | Zhouzimo Kernel (Based on E404R @ Project113) |' AnyKernel3/anykernel.sh

          cd AnyKernel3

          ZIP_NAME="Zhouzimo-POCO_F4-$(date +%y%m%d-%H%M).zip"

          zip -r9 "../${ZIP_NAME}" META-INF tools MUNCH-* anykernel.sh

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=build-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Verify ZIP
        run: |
          echo "Current dir:"
          pwd
          echo
          echo "ZIP files:"
          find . -name "*.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zhouzimo-Kernel
          path: Zhouzimo-*.zip


      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${TG_BOT_TOKEN}" || -z "${TG_CHAT_ID}" ]]; then
            echo "::warning::TG_BOT_TOKEN or TG_CHAT_ID secret is not set; skipping Telegram upload."
            exit 0
          fi

          if [[ ! -f "${ZIP_NAME}" ]]; then
            echo "::error::Flashable zip not found: ${ZIP_NAME}"
            exit 1
          fi

          python3 - <<'PY' > /tmp/tg_caption.html
          import html
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GITHUB_TOKEN", "")
          branch = os.environ.get("KERNEL_BRANCH", "zhouzimo")
          release_tag = os.environ["RELEASE_TAG"]
          kernel_sha = os.environ["KERNEL_SHA"]
          short_sha = os.environ["KERNEL_SHORT_SHA"]
          kernel_release = os.environ.get("KERNEL_RELEASE", "unknown")

          def gh_get(path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "zhouzimo-ci",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except (urllib.error.URLError, TimeoutError, ValueError):
                  return None

          prev_tag = None
          releases = gh_get(f"/repos/{repo}/releases?per_page=10") or []
          for rel in releases:
              tag = rel.get("tag_name")
              if tag and tag != release_tag:
                  prev_tag = tag
                  break

          subjects = []
          heading = "Recent commits:"
          if prev_tag:
              q_prev = urllib.parse.quote(prev_tag, safe="")
              cmp_data = gh_get(f"/repos/{repo}/compare/{q_prev}...{kernel_sha}")
              if cmp_data and cmp_data.get("commits"):
                  subjects = [
                      c["commit"]["message"].splitlines()[0].strip()
                      for c in cmp_data["commits"]
                      if c.get("commit", {}).get("message")
                  ]
                  subjects.reverse()
                  heading = f"Changelog (since {prev_tag}):"

          if not subjects:
              commits = gh_get(f"/repos/{repo}/commits?sha={kernel_sha}&per_page=10") or []
              subjects = [
                  c["commit"]["message"].splitlines()[0].strip()
                  for c in commits
                  if c.get("commit", {}).get("message")
              ]

          e = html.escape
          header_plain = [
              "Zhouzimo Kernel - Poco F4 (munch)",
              f"Kernel: {kernel_release}",
              f"Branch: {branch} | Build: {release_tag}",
              f"Commit: {short_sha}",
              "",
              heading,
          ]
          header_html = [
              "<b>Zhouzimo Kernel - Poco F4 (munch)</b>",
              f"<b>Kernel:</b> <code>{e(kernel_release)}</code>",
              f"<b>Branch:</b> <code>{e(branch)}</code> | <b>Build:</b> <code>{e(release_tag)}</code>",
              f"<b>Commit:</b> <code>{e(short_sha)}</code>",
              "",
              f"<b>{e(heading)}</b>",
          ]

          rel_url = f"https://github.com/{repo}/releases/tag/{urllib.parse.quote(release_tag, safe='')}"
          managers_plain = "Managers: KernelSU | NoroiSU | MidoriSU"
          managers_html = (
              '<b>Managers:</b> '
              '<a href="https://github.com/backslashxx/KernelSU/releases">KernelSU</a> | '
              '<a href="https://github.com/re-noroi/KernelSU/releases">NoroiSU</a> | '
              '<a href="https://github.com/midori01/KernelSU/releases">MidoriSU</a>'
          )
          footer_plain = "GitHub Release"
          footer_html = f'<a href="{e(rel_url, quote=True)}">GitHub Release</a>'
          if prev_tag:
              diff_url = f"https://github.com/{repo}/compare/{urllib.parse.quote(prev_tag, safe='')}...{urllib.parse.quote(release_tag, safe='')}"
              footer_plain += " | Full Diff"
              footer_html += f' | <a href="{e(diff_url, quote=True)}">Full Diff</a>'

          # Telegram sendDocument caption limit is 1024 parsed characters; reserve margin for overflow line
          max_plain = 940
          used = sum(len(line) + 1 for line in header_plain) + len(managers_plain) + 1 + len(footer_plain) + 2
          body_html = []
          shown = 0
          for subj in subjects[:15]:
              clipped = subj if len(subj) <= 88 else subj[:85] + "..."
              line_plain = f"• {clipped}"
              if used + len(line_plain) + 1 > max_plain:
                  break
              body_html.append(f"• {e(clipped)}")
              used += len(line_plain) + 1
              shown += 1

          remaining = len(subjects) - shown
          if not body_html:
              body_html.append("• No new commits recorded")
          elif remaining > 0:
              body_html.append(f"• <i>...and {remaining} more commits</i>")

          print("\n".join(header_html + body_html + ["", managers_html, footer_html]))
          PY

          resp=$(printf 'url = "https://api.telegram.org/bot%s/sendDocument"\n' "${TG_BOT_TOKEN}" | \
            curl -sS --max-time 180 -K - \
              -F "chat_id=${TG_CHAT_ID}" \
              -F "parse_mode=HTML" \
              -F "caption=</tmp/tg_caption.html" \
              -F "document=@${ZIP_NAME}")

          python3 -c 'import json, sys; d = json.loads(sys.argv[1]); ok = d.get("ok", False); desc = d.get("description", "unknown error"); print("Telegram upload OK" if ok else f"Telegram upload failed: {desc}"); sys.exit(0 if ok else 1)' "$resp"
          
